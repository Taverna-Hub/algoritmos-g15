version: '3.8'

services:
  node-red:
    image: nodered/node-red:latest
    container_name: nodered_wifi_detection
    ports:
      - "1880:1880"
      - "1883:1883"
    volumes:
      - node_red_data:/data
      - ./flows.json:/data/flows.json
    environment:
      - NODE_RED_ENABLE_PROJECTS=false
      - TZ=UTC
    networks:
      - wifi_network
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - wifi_network
    restart: unless-stopped
    command: mosquitto -c /mosquitto/config/mosquitto.conf

volumes:
  node_red_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  wifi_network:
    driver: bridge
